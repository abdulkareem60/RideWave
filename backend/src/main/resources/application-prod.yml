# ============================================================
# RideWave – Production Profile Overrides
# ============================================================

server:
  port: ${PORT:8080}

spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  # ═══════════════════════════════════════════════════════════
  # Explicit Flyway control — prevents 100+ second stalls
  # ═══════════════════════════════════════════════════════════
  flyway:
    enabled: false

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

twilio:
  enabled: true

payment:
  provider: stripe

logging:
  level:
    com.ridewave: INFO
    org.springframework.security: WARN
    root: WARN