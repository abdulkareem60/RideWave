spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ridewave_dev
    username: ${DB_USER:postgres}
    password: '${DB_PASS:}'
    hikari:
      pool-name: RideWaveHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20

  flyway:
    enabled: false

# ═══════════════════════════════════════════════════════════
# JWT — REQUIRED by JwtTokenProvider.java
# ═══════════════════════════════════════════════════════════
jwt:
  secret: ${JWT_SECRET:dev-local-secret-key-must-be-at-least-64-characters-long-for-hs512-algorithm-xyz123}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# ═══════════════════════════════════════════════════════════
# Brevo / Sendinblue — REQUIRED by BrevoEmailService.java
# ═══════════════════════════════════════════════════════════
brevo:
  api-key: ${BREVO_API_KEY:dev-brevo-api-key-12345}

# ═══════════════════════════════════════════════════════════
# AppProperties bindings — REQUIRED by SecurityConfig & BrevoEmailService
# ═══════════════════════════════════════════════════════════
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  mail:
    from-name: ${MAIL_FROM_NAME:RideWave Dev}
    from-address: ${MAIL_FROM_ADDRESS:noreply@ridewave.local}
  verification:
    ai-score-threshold: ${AI_SCORE_THRESHOLD:0.80}

logging:
  level:
    com.ridewave: DEBUG
    org.hibernate.SQL: WARN